<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMMORTALIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=VT323&display=swap');
      
      body {
        background-color: #0c0a09; /* stone-950 */
        color: #e7e5e4; /* stone-200 */
        font-family: 'Crimson Text', serif;
        overflow: hidden;
        image-rendering: pixelated;
      }
      
      .font-pixel {
        font-family: 'VT323', monospace;
      }

      /* Pixel Art Rendering for Canvas */
      canvas {
        image-rendering: pixelated; 
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }

      /* Retro Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
        background: #1c1917;
      }
      ::-webkit-scrollbar-track {
        background: #0c0a09; 
        border-left: 1px solid #292524;
      }
      ::-webkit-scrollbar-thumb {
        background: #44403c; 
        border: 2px solid #1c1917;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #57534e; 
      }

      /* Retro Selection */
      ::selection {
        background: #7f1d1d; /* Red-900 */
        color: #fff;
      }

      /* Utilities for SNES/Retro Borders */
      .retro-border {
        border: 4px solid #292524;
        box-shadow: 
          inset 2px 2px 0px 0px #44403c,
          inset -2px -2px 0px 0px #0c0a09;
      }

      .retro-btn {
        border: 2px solid #000;
        box-shadow: 
          inset 2px 2px 0px 0px rgba(255,255,255,0.1),
          inset -2px -2px 0px 0px rgba(0,0,0,0.5);
      }
      .retro-btn:active {
        box-shadow: 
          inset 2px 2px 0px 0px rgba(0,0,0,0.5),
          inset -2px -2px 0px 0px rgba(255,255,255,0.1);
        transform: translateY(2px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
